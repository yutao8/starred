name: Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制：同一时间只允许一个部署任务，新任务会取消旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for 3 minutes
        run: |
          echo "等待 3 分钟后开始部署，防止短时间多次提交..."
          sleep 180

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare artifact folder
        run: |
          mkdir -p artifact/data
          # 1. 复制前端静态网页与样式脚本
          cp index.html history.html trend.html artifact/
          cp -r assets artifact/

          # 2. 复制前端运行所需核心数据 (排除体积庞大的 data/dist 历史全量快照)
          cp data/starList.public.json data/trend.json data/trend.md artifact/data/ 2>/dev/null || true
          cp -r data/repos artifact/data/ 2>/dev/null || true
          cp -r data/trend_history artifact/data/ 2>/dev/null || true

          # 3. 根目录兼容 (供旧版相对路径访问)
          cp data/starList.public.json data/trend.json data/trend.md artifact/ 2>/dev/null || true

          # 4. 仅附带最新 1 期 dist 快照供离线查阅 (避免千余个历史快照累积突破 Pages 体积限制)
          mkdir -p artifact/data/dist
          latest_dist=$(ls -1d data/dist/* 2>/dev/null | sort | tail -n 1)
          if [ -n "$latest_dist" ]; then
            cp -r "$latest_dist" artifact/data/dist/
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifact

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
