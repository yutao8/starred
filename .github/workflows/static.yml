name: Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制：同一时间只允许一个部署任务，新任务会取消旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for 3 minutes
        run: |
          echo "等待 3 分钟后开始部署，防止短时间多次提交..."
          sleep 180

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare artifact folder
        run: |
          mkdir artifact
          cp index.html history.html trend.html trend.json trend.md starList.json starList.public.json artifact/
          cp -r assets repos artifact/
          cp -r trend_history artifact/ 2>/dev/null || true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifact

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
