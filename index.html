<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starred Projects · 收藏仓库与知识库</title>
    <meta name="description" content="智能化 GitHub Starred 仓库库与分类检索系统，包含大模型中文深度提炼与演进走势">
    <link href="./assets/vendor/bootstrap.min.css" rel="stylesheet">
    <link href="./assets/vendor/bootstrap-icons.css" rel="stylesheet">
    <link href="./assets/css/app.css" rel="stylesheet">
    <script src="./assets/vendor/vue.global.prod.js"></script>
    <script src="./assets/js/common.js"></script>
    <style>
        /* 侧边栏与内容区主布局 */
        .index-layout {
            display: flex;
            min-height: calc(100vh - var(--nav-height));
            transition: max-width 0.3s ease;
        }
        [data-layout="boxed"] .index-layout {
            max-width: 1536px;
            margin: 0 auto;
        }

        .index-sidebar {
            position: sticky;
            top: var(--nav-height);
            height: calc(100vh - var(--nav-height));
            width: var(--sidebar-width);
            background: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            z-index: 900;
            padding: 1.2rem 0.8rem;
            transition: transform 0.25s ease, background-color 0.2s ease, border-color 0.2s ease;
            flex-shrink: 0;
        }

        .index-content {
            flex: 1;
            padding: 2rem 2.5rem 4rem;
            min-height: calc(100vh - var(--nav-height));
            min-width: 0;
        }

        /* 侧边栏语言项 */
        .sidebar-lang-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.55rem 0.85rem;
            margin-bottom: 0.25rem;
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
        }
        .sidebar-lang-item:hover {
            color: var(--brand);
            background: var(--bg-surface-mute);
            text-decoration: none;
        }
        .sidebar-lang-item.active {
            color: var(--brand);
            background: var(--brand-light);
            font-weight: 700;
            border-left-color: var(--brand);
        }
        .sidebar-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.6rem;
            flex-shrink: 0;
        }
        .sidebar-count {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .project-stream {
            display: grid;
            gap: 1.25rem;
            grid-template-columns: 1fr;
        }
        @media (min-width: 860px) {
            .project-stream {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (min-width: 1400px) {
            .project-stream {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* 项目卡片 */
        .project-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1rem 1.2rem;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s ease, border-color 0.2s ease;
            position: relative;
            overflow: hidden;
            content-visibility: auto;
            contain-intrinsic-size: 240px;
        }
        .project-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--border-color-hover);
        }

        .project-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 0.6rem;
        }
        .project-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin: 0;
        }
        .project-title a {
            color: var(--text-primary);
            text-decoration: none;
            transition: color 0.2s;
        }
        .project-title a:hover {
            color: var(--brand);
        }
        .project-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-color);
        }

        .project-desc-zh {
            font-size: 0.9rem;
            color: var(--text-primary);
            line-height: 1.55;
            margin-bottom: 0.6rem;
            background: var(--bg-surface-soft);
            padding: 0.5rem 0.75rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color-subtle);
        }
        .project-desc-en {
            font-size: 0.84rem;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-bottom: 0.6rem;
        }

        .project-stats-wrap {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            flex-wrap: wrap;
        }

        .topic-pill {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 0.18rem 0.55rem;
            border-radius: 9999px;
            background: var(--bg-surface-mute);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            margin-right: 0.35rem;
            margin-bottom: 0.35rem;
        }

        .lang-group-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-primary);
            padding-left: 0.8rem;
            border-left: 4px solid var(--brand);
            margin: 2.2rem 0 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            scroll-margin-top: calc(var(--nav-height) + 1rem);
        }

        @media (max-width: 992px) {
            .index-sidebar {
                position: fixed;
                left: 0;
                transform: translateX(-100%);
            }
            .index-sidebar.show {
                transform: translateX(0);
                box-shadow: var(--shadow-lg);
            }
            .index-content {
                padding: 1.5rem 1rem 3rem;
            }
        }
    </style>
</head>
<body>
<div id="app">
    <!-- 统一头部导航栏 -->
    <header class="app-navbar">
        <div class="app-navbar-inner">
            <div class="d-flex align-items-center gap-3">
                <button class="d-lg-none app-icon-btn" @click="toggleSidebar" title="展开/收起分类">
                    <i class="bi bi-list"></i>
                </button>
                <a href="index.html" class="app-brand">
                    <span class="brand-icon"><i class="bi bi-stars"></i></span>
                    <span class="brand-text">Starred <span class="brand-accent">Projects</span></span>
                </a>
            </div>

            <!-- 顶栏全局快捷搜索 -->
            <div class="app-search-box d-none d-md-flex mx-3" style="max-width: 420px;">
                <i class="bi bi-search search-icon"></i>
                <input type="text" class="app-search-input" placeholder="输入名称、描述或 Topics 进行即时搜索..." v-model="searchQuery">
            </div>

            <div class="d-flex align-items-center gap-2">
                <nav class="app-nav-menu d-none d-sm-flex">
                    <a href="index.html" class="app-nav-item active" title="仓库列表">
                        <i class="bi bi-grid-3x3-gap"></i> <span>仓库列表</span>
                    </a>
                    <a href="trend.html" class="app-nav-item" title="7天多维增长趋势排行">
                        <i class="bi bi-fire"></i> <span>趋势排行</span>
                    </a>
                    <a href="history.html" class="app-nav-item" title="单项目历史演进轨迹">
                        <i class="bi bi-graph-up-arrow"></i> <span>历史走势</span>
                    </a>
                </nav>

                <div class="app-nav-actions">
                    <a href="https://github.com/yutao8/starred" target="_blank" class="app-icon-btn" title="GitHub 仓库">
                        <i class="bi bi-github"></i>
                    </a>
                    <button class="app-icon-btn theme-toggle-btn" @click="toggleLayout" title="切换宽屏/居中模式">
                        <i :class="isFluid ? 'bi bi-fullscreen-exit' : 'bi bi-fullscreen'"></i>
                    </button>
                    <button class="app-icon-btn theme-toggle-btn" @click="toggleTheme" title="切换暗黑/明亮主题">
                        <i :class="isDark ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill'"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主体布局（侧边栏分类 + 主列表） -->
    <main class="app-main">
        <!-- 移动端搜索栏 -->
        <div class="p-3 d-md-none bg-surface border-bottom border-color">
            <div class="app-search-box w-100">
                <i class="bi bi-search search-icon"></i>
                <input type="text" class="app-search-input" placeholder="搜索名称、中文解析、标签..." v-model="searchQuery">
            </div>
        </div>

        <div class="index-layout">
            <!-- 左侧语言与分类导航 -->
            <aside class="index-sidebar" id="sidebar" :class="{ show: sidebarOpen }">
                <div class="d-flex align-items-center justify-content-between px-2 mb-3 pb-2 border-bottom border-color">
                    <span class="fw-bold text-primary small text-uppercase" style="letter-spacing: 0.05em;">
                        <i class="bi bi-funnel text-success"></i> 语言分类索引
                    </span>
                    <span class="badge-pill brand">{{ Object.keys(sidebarGroupedProjects).length }} 种</span>
                </div>

                <div v-for="(projects, lang) in sidebarGroupedProjects" :key="lang"
                     class="sidebar-lang-item" :class="{ active: activeLang === lang }"
                     @click="scrollToLang(lang)">
                    <div class="d-flex align-items-center text-truncate">
                        <span class="sidebar-dot" :style="{ backgroundColor: getLangColor(lang) }"></span>
                        <span class="text-truncate">{{ lang }}</span>
                    </div>
                    <span class="sidebar-count">{{ projects.length }}</span>
                </div>
            </aside>

            <!-- 右侧主项目内容区 -->
            <section class="index-content">
                <!-- 加载状态 -->
                <div v-if="loading" class="app-loading-box">
                    <div class="app-spinner"></div>
                    <div>正在读取并解析 Starred 知识库...</div>
                </div>

                <!-- 错误状态 -->
                <div v-else-if="error" class="app-empty-box">
                    <i class="bi bi-exclamation-circle text-danger"></i>
                    <div class="text-danger fw-bold mt-2">{{ error }}</div>
                </div>

                <!-- 项目列表 -->
                <template v-else>
                    <!-- 统计概览横幅 -->
                    <div class="app-page-header">
                        <div>
                            <h1 class="app-page-title">
                                <i class="bi bi-collection-fill text-success"></i> GitHub Starred 知识库
                            </h1>
                            <p class="app-page-subtitle">
                                共收录 <strong>{{ rawTotalCount }}</strong> 个高质量项目 · 已加载 <strong>{{ filteredProjects.length }}</strong> 个匹配结果
                            </p>
                        </div>
                        <div class="d-flex gap-2">
                            <a href="trend.html" class="app-btn primary">
                                <i class="bi bi-fire"></i> 查看趋势榜单
                            </a>
                            <a href="history.html" class="app-btn">
                                <i class="bi bi-graph-up-arrow"></i> 历史走势查询
                            </a>
                        </div>
                    </div>

                    <div v-if="filteredProjects.length === 0" class="app-empty-box">
                        <i class="bi bi-search"></i>
                        <div class="fs-6 fw-bold">未找到与 "{{ searchQuery }}" 匹配的仓库</div>
                        <div class="small text-muted mt-1">请尝试更换搜索关键词或查看其他语言分类</div>
                    </div>

                    <div v-else>
                        <div v-for="(projects, lang) in groupedProjects" :key="lang + '-group'" class="mb-5">
                            <!-- 分组标题 -->
                            <h2 class="lang-group-title" :id="'lang-' + lang" :style="{ borderLeftColor: getLangColor(lang) }">
                                <span :style="{ color: getLangColor(lang) }">●</span> {{ lang }}
                                <span class="badge-pill brand ms-2">{{ projects.length }} 库</span>
                            </h2>

                            <!-- 仓库卡片流 -->
                            <div class="project-stream">
                                <article v-for="project in projects" :key="project.id || project.full_name"
                                         class="project-card">
                                    <!-- 头部：标题、作者、基础指标 -->
                                    <div class="project-header">
                                        <div class="d-flex align-items-center gap-2 flex-wrap">
                                            <img v-if="project.owner && project.owner.avatar_url"
                                                 :src="project.owner.avatar_url"
                                                 :alt="project.owner.login"
                                                 class="project-avatar"
                                                 loading="lazy"
                                                 decoding="async"
                                                 referrerpolicy="no-referrer"
                                                 onerror="this.style.visibility='hidden'">
                                            <h3 class="project-title">
                                                <a :href="project.html_url" target="_blank">{{ project.full_name || project.name }}</a>
                                            </h3>
                                            <span class="badge-pill">
                                                <span :style="{ color: getLangColor(project.language) }">●</span> {{ project.language || 'Other' }}
                                            </span>
                                        </div>

                                        <div class="project-stats-wrap">
                                            <span class="badge-pill amber" title="Star 总数">
                                                <i class="bi bi-star-fill text-warning"></i> {{ (project.stargazers_count || 0).toLocaleString() }}
                                            </span>
                                            <span class="badge-pill blue" title="Fork 总数">
                                                <i class="bi bi-git text-primary"></i> {{ (project.forks_count || 0).toLocaleString() }}
                                            </span>
                                            <span v-if="project.open_issues_count > 0" class="badge-pill" title="未关闭 Issues">
                                                <i class="bi bi-exclamation-circle"></i> {{ project.open_issues_count }}
                                            </span>
                                            <a :href="'history.html?repo=' + encodeURIComponent(project.full_name || project.name)"
                                               target="_blank"
                                               class="badge-pill brand text-decoration-none"
                                               title="查看该项目的历史 Star 增长走势折线图">
                                                <i class="bi bi-graph-up"></i> 历史走势
                                            </a>
                                            <a v-if="project.homepage" :href="project.homepage" target="_blank" class="app-icon-btn" style="width:1.8rem;height:1.8rem;font-size:0.85rem" title="官网/主页">
                                                <i class="bi bi-house"></i>
                                            </a>
                                            <a :href="project.html_url" target="_blank" class="app-icon-btn" style="width:1.8rem;height:1.8rem;font-size:0.85rem" title="GitHub 源码">
                                                <i class="bi bi-github"></i>
                                            </a>
                                        </div>
                                    </div>

                                    <!-- 中文 AI 深度技术解析 -->
                                    <div v-if="project.desc" class="project-desc-zh">
                                        <i class="bi bi-robot text-success me-1"></i> {{ project.desc }}
                                    </div>

                                    <!-- 原生描述 -->
                                    <div v-if="project.description && project.description !== project.desc" class="project-desc-en">
                                        <i class="bi bi-quote text-muted me-1"></i> {{ project.description }}
                                    </div>

                                    <!-- Topics 标签 -->
                                    <div v-if="project.topics && project.topics.length" class="mb-3">
                                        <span v-for="topic in project.topics" :key="topic" class="topic-pill">
                                            #{{ topic }}
                                        </span>
                                    </div>

                                    <!-- 底部元数据信息 -->
                                    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 text-muted small pt-2 border-top border-color-subtle">
                                        <div class="d-flex align-items-center gap-3 flex-wrap">
                                            <span v-if="project.license"><i class="bi bi-shield-check"></i> {{ project.license.spdx_id || project.license.name }}</span>
                                            <span v-if="project.size"><i class="bi bi-hdd"></i> {{ (project.size / 1024).toFixed(1) }} MB</span>
                                            <span v-if="project.default_branch"><i class="bi bi-git"></i> {{ project.default_branch }}</span>
                                        </div>
                                        <div class="d-flex align-items-center gap-3 flex-wrap">
                                            <span v-if="project.pushed_at"><i class="bi bi-upload"></i> 活跃: {{ project.pushed_at.slice(0, 10) }}</span>
                                            <span v-if="project.created_at"><i class="bi bi-calendar-event"></i> 创建: {{ project.created_at.slice(0, 10) }}</span>
                                        </div>
                                    </div>
                                </article>
                            </div>
                        </div>
                    </div>
                </template>
            </section>
        </div>
    </main>

    <!-- 统一页脚 -->
    <footer class="app-footer">
        <div>Starred Projects · 自动化 GitHub Star 资产管理与趋势洞察系统</div>
        <div class="small text-muted mt-1">数据由 GitHub Actions 定时自动更新 · 深度集成大语言模型中文技术解析</div>
    </footer>
</div>

<script>
const { createApp, ref, computed, onMounted, onBeforeUnmount, watch } = Vue;

function debounce(fn, delay = 250) {
    let timer = null;
    return function(...args) {
        clearTimeout(timer);
        timer = setTimeout(() => fn.apply(this, args), delay);
    };
}

createApp({
    setup() {
        const isDark = ref(StarredCommon.getTheme() === 'dark');
        const toggleTheme = () => {
            const next = StarredCommon.toggleTheme();
            isDark.value = (next === 'dark');
        };

        const isFluid = ref(StarredCommon.getLayout() === 'fluid');
        const toggleLayout = () => {
            const next = StarredCommon.toggleLayout();
            isFluid.value = (next === 'fluid');
        };

        const loading = ref(true);
        const error = ref(null);
        const searchQuery = ref('');
        const sidebarOpen = ref(false);
        const activeLang = ref('');
        const rawTotalCount = ref(0);

        const filteredProjects = ref([]);
        const renderLimit = ref(0);
        let rawProjects = [];
        let sortedLanguages = [];
        let renderFrame = null;
        let languageObserver = null;
        let observeTimer = null;
        const initialRenderCount = 20;
        const renderChunkSize = 30;

        const normalizeText = (value) => String(value || '').toLowerCase();

        const buildSearchText = (project) => {
            return [
                project.full_name,
                project.name,
                project.desc,
                project.description,
                project.language,
                project.owner && project.owner.login,
                ...(project.topics || [])
            ].map(normalizeText).join(' ');
        };

        const groupProjects = (list) => {
            const groups = {};
            list.forEach(project => {
                const lang = project.language || 'Other';
                if (!groups[lang]) groups[lang] = [];
                groups[lang].push(project);
            });
            const result = {};
            sortedLanguages.forEach(lang => {
                if (groups[lang]) {
                    result[lang] = groups[lang];
                }
            });
            return result;
        };

        const renderedProjects = computed(() => filteredProjects.value.slice(0, renderLimit.value));
        const sidebarGroupedProjects = computed(() => groupProjects(filteredProjects.value));
        const groupedProjects = computed(() => groupProjects(renderedProjects.value));

        const updateRenderedProjects = (list) => {
            if (renderFrame) {
                cancelAnimationFrame(renderFrame);
                renderFrame = null;
            }

            filteredProjects.value = list;
            renderLimit.value = Math.min(initialRenderCount, list.length);

            const appendChunk = () => {
                if (renderLimit.value >= filteredProjects.value.length) {
                    renderFrame = null;
                    return;
                }

                renderLimit.value = Math.min(
                    renderLimit.value + renderChunkSize,
                    filteredProjects.value.length
                );
                scheduleObserveLanguageTitles();
                renderFrame = requestAnimationFrame(appendChunk);
            };

            if (renderLimit.value < list.length) {
                renderFrame = requestAnimationFrame(appendChunk);
            }
            scheduleObserveLanguageTitles();
        };

        const getLangColor = (lang) => {
            return StarredCommon.getLanguageColor(lang);
        };

        const scrollToLang = (lang) => {
            if (window.innerWidth <= 992) {
                sidebarOpen.value = false;
            }
            const id = 'lang-' + lang;
            const element = document.getElementById(id);
            if (!element && renderLimit.value < filteredProjects.value.length) {
                if (renderFrame) {
                    cancelAnimationFrame(renderFrame);
                    renderFrame = null;
                }
                renderLimit.value = filteredProjects.value.length;
                scheduleObserveLanguageTitles();
                setTimeout(() => scrollToLang(lang), 0);
                return;
            }
            if (element) {
                element.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        };

        const toggleSidebar = () => {
            sidebarOpen.value = !sidebarOpen.value;
        };

        const scheduleObserveLanguageTitles = () => {
            clearTimeout(observeTimer);
            observeTimer = setTimeout(() => {
                if (!languageObserver) return;
                languageObserver.disconnect();
                document.querySelectorAll('.lang-group-title').forEach(el => languageObserver.observe(el));
            }, 80);
        };

        const doFilter = debounce(() => {
            const query = normalizeText(searchQuery.value).trim();
            if (!query) {
                updateRenderedProjects(rawProjects);
                return;
            }

            const keywords = query.split(/\s+/).filter(Boolean);
            const matchedProjects = rawProjects.filter(project => {
                return keywords.every(keyword => project._searchText.includes(keyword));
            });
            updateRenderedProjects(matchedProjects);
        }, 250);

        watch(searchQuery, doFilter);

        onMounted(async () => {
            try {
                let res = await fetch('./data/starList.public.json?_t=' + Date.now());
                if (!res.ok) {
                    res = await fetch('./starList.public.json?_t=' + Date.now());
                }
                if (!res.ok) throw new Error('无法加载 starList 数据');
                rawProjects = await res.json();
                rawTotalCount.value = rawProjects.length;

                rawProjects.forEach(project => {
                    project.language = project.language || 'Other';
                    project._searchText = buildSearchText(project);
                });
                rawProjects.sort((a, b) => {
                    const langCompare = a.language.localeCompare(b.language, 'zh-CN');
                    if (langCompare !== 0) return langCompare;
                    return (b.stargazers_count || 0) - (a.stargazers_count || 0);
                });
                sortedLanguages = Array.from(new Set(rawProjects.map(project => project.language)));
                updateRenderedProjects(rawProjects);
            } catch (e) {
                error.value = e.message;
            } finally {
                loading.value = false;
            }

            window.addEventListener('starred-theme-changed', (e) => {
                isDark.value = (e.detail.theme === 'dark');
            });

            languageObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        activeLang.value = entry.target.id.replace(/^lang-/, '');
                    }
                });
            }, { rootMargin: "-30% 0px -60% 0px" });
            scheduleObserveLanguageTitles();
        });

        onBeforeUnmount(() => {
            if (renderFrame) {
                cancelAnimationFrame(renderFrame);
            }
            clearTimeout(observeTimer);
            if (languageObserver) {
                languageObserver.disconnect();
            }
        });

        return {
            isDark,
            isFluid,
            loading,
            error,
            searchQuery,
            sidebarOpen,
            activeLang,
            rawTotalCount,
            filteredProjects,
            sidebarGroupedProjects,
            groupedProjects,
            toggleTheme,
            toggleLayout,
            toggleSidebar,
            getLangColor,
            scrollToLang
        };
    }
}).mount('#app');
</script>
