<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>趋势排行 · Starred Projects</title>
    <meta name="description" content="GitHub Star 趋势多维分析 — 增长率、绝对增量、Fork 爆发、语言热度等多维排行榜">
    <link href="./assets/vendor/bootstrap.min.css" rel="stylesheet">
    <link href="./assets/vendor/bootstrap-icons.css" rel="stylesheet">
    <link href="./assets/css/app.css" rel="stylesheet">
    <script src="./assets/vendor/vue.global.prod.js"></script>
    <script src="./assets/js/common.js"></script>
</head>
<body>
<div id="app">
    <!-- 统一头部导航栏 -->
    <header class="app-navbar">
        <div class="app-navbar-inner">
            <a href="index.html" class="app-brand">
                <span class="brand-icon"><i class="bi bi-stars"></i></span>
                <span class="brand-text">Starred <span class="brand-accent">Projects</span></span>
            </a>
            
            <div class="d-flex align-items-center gap-2">
                <nav class="app-nav-menu d-none d-sm-flex">
                    <a href="index.html" class="app-nav-item" title="浏览全部收藏项目">
                        <i class="bi bi-grid-3x3-gap"></i> <span>仓库列表</span>
                    </a>
                    <a href="trend.html" class="app-nav-item active" title="7天多维增长趋势排行">
                        <i class="bi bi-fire"></i> <span>趋势排行</span>
                    </a>
                    <a href="history.html" class="app-nav-item" title="单项目历史演进轨迹">
                        <i class="bi bi-graph-up-arrow"></i> <span>历史走势</span>
                    </a>
                </nav>

                <div class="app-nav-actions">
                    <a href="https://github.com/yutao8/starred" target="_blank" class="app-icon-btn" title="GitHub 仓库">
                        <i class="bi bi-github"></i>
                    </a>
                    <button class="app-icon-btn theme-toggle-btn" @click="toggleTheme" title="切换暗黑/明亮主题">
                        <i :class="isDark ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill'"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="app-main">
        <div class="app-container">
            <!-- 加载状态 -->
            <div v-if="loading" class="app-loading-box">
                <div class="app-spinner"></div>
                <div>正在加载最新趋势数据...</div>
            </div>

            <!-- 错误状态 -->
            <div v-else-if="error" class="app-empty-box">
                <i class="bi bi-exclamation-triangle text-danger"></i>
                <div class="fs-5 fw-bold text-danger mb-2">{{ error }}</div>
                <div class="small text-muted">请确保已执行 <code>php trend.php</code> 生成趋势数据</div>
                <button class="app-btn primary mt-3" @click="reloadLatest"><i class="bi bi-arrow-clockwise"></i> 重新加载</button>
            </div>

            <template v-else>
                <!-- 页面头部与元数据横幅 -->
                <div class="app-page-header">
                    <div>
                        <h1 class="app-page-title">
                            <i class="bi bi-fire text-warning"></i> 多维趋势排行榜
                        </h1>
                        <p class="app-page-subtitle">
                            基于最近 {{ data.analysis_days || 7 }} 天历史快照分析 · {{ data.cutoff_date?.slice(0,10) }} ～ {{ data.data_latest_date?.slice(0,10) }} · 覆盖 {{ data.total_repos }} 个精选仓库
                        </p>
                    </div>

                    <div class="d-flex align-items-center gap-2 flex-wrap">
                        <span v-if="currentSlot" class="badge-pill brand">
                            <i class="bi bi-clock-history"></i> 历史快照：{{ currentSlot }}
                            <a href="#" @click.prevent="reloadLatest" class="ms-1 text-decoration-none text-success fw-bold">返回最新</a>
                        </span>
                        <button @click="activeTab='history'" class="app-btn">
                            <i class="bi bi-clock-history"></i> 快照回溯 ({{ historyList.length }})
                        </button>
                    </div>
                </div>

                <!-- 核心四大指标卡片 -->
                <div class="stat-grid">
                    <div class="stat-card" @click="activeTab='heat'" style="cursor:pointer">
                        <div class="stat-header">
                            <span class="stat-label">🔥 综合热度榜首</span>
                            <span class="stat-icon"><i class="bi bi-fire text-danger"></i></span>
                        </div>
                        <div class="stat-value text-truncate" :title="topHeatRepo?.full_name">{{ topHeatRepo?.full_name?.split('/')[1] || '-' }}</div>
                        <div class="stat-footer">
                            <span class="text-muted">{{ topHeatRepo?.full_name?.split('/')[0] }}</span>
                            <span class="badge-pill amber ms-auto">热度 {{ topHeatRepo?.heat_score }}</span>
                        </div>
                    </div>

                    <div class="stat-card amber" @click="activeTab='star_diff'" style="cursor:pointer">
                        <div class="stat-header">
                            <span class="stat-label">⭐ Star 增量榜首</span>
                            <span class="stat-icon"><i class="bi bi-star-fill text-warning"></i></span>
                        </div>
                        <div class="stat-value text-truncate" :title="topStarDiffRepo?.full_name">{{ topStarDiffRepo?.full_name?.split('/')[1] || '-' }}</div>
                        <div class="stat-footer">
                            <span class="text-muted">{{ topStarDiffRepo?.full_name?.split('/')[0] }}</span>
                            <span class="badge-pill amber ms-auto">+{{ (topStarDiffRepo?.star_diff || 0).toLocaleString() }} ★</span>
                        </div>
                    </div>

                    <div class="stat-card blue" @click="activeTab='growth'" style="cursor:pointer">
                        <div class="stat-header">
                            <span class="stat-label">🚀 增长率黑马</span>
                            <span class="stat-icon"><i class="bi bi-lightning-charge-fill text-primary"></i></span>
                        </div>
                        <div class="stat-value text-truncate" :title="topGrowthRepo?.full_name">{{ topGrowthRepo?.full_name?.split('/')[1] || '-' }}</div>
                        <div class="stat-footer">
                            <span class="text-muted">{{ topGrowthRepo?.full_name?.split('/')[0] }}</span>
                            <span class="badge-pill blue ms-auto">+{{ topGrowthRepo?.star_growth_rate }}%</span>
                        </div>
                    </div>

                    <div class="stat-card purple" @click="activeTab='lang'" style="cursor:pointer">
                        <div class="stat-header">
                            <span class="stat-label">🌐 领跑编程语言</span>
                            <span class="stat-icon"><i class="bi bi-code-slash text-purple"></i></span>
                        </div>
                        <div class="stat-value">{{ topLang?.language || '-' }}</div>
                        <div class="stat-footer">
                            <span class="text-muted">{{ topLang?.repo_count }} 个项目</span>
                            <span class="badge-pill purple ms-auto">+{{ (topLang?.star_diff || 0).toLocaleString() }} ★</span>
                        </div>
                    </div>
                </div>

                <!-- 维度切换 Tab 栏 -->
                <div class="app-tabs">
                    <button v-for="t in tabs" :key="t.key" class="app-tab-btn" :class="{ active: activeTab === t.key }" @click="activeTab = t.key">
                        {{ t.icon }} <span>{{ t.label }}</span>
                    </button>
                </div>

                <!-- 视图 1: 历史快照版本对比与回溯 -->
                <div v-if="activeTab === 'history'">
                    <div v-if="historyLoading" class="app-loading-box" style="padding: 2rem">
                        <div class="app-spinner"></div>
                    </div>
                    <div v-else-if="historyList.length === 0" class="app-empty-box">
                        暂无历史快照存档，请在流水线中执行 php trend.php
                    </div>
                    <div v-else class="d-flex flex-column gap-3">
                        <div v-for="item in historyList" :key="item.slot" class="app-card" :style="currentSlot === item.slot ? 'border-color: var(--brand); box-shadow: var(--shadow-glow);' : ''">
                            <div class="app-card-body d-flex align-items-center justify-content-between flex-wrap gap-3">
                                <div>
                                    <div class="fw-bold fs-6 mb-1 d-flex align-items-center gap-2">
                                        <i class="bi bi-clock-history text-success"></i> {{ item.generated_at }}
                                        <span v-if="currentSlot === item.slot" class="badge-pill brand">当前浏览中</span>
                                    </div>
                                    <div class="text-muted small">
                                        {{ item.analysis_days }} 天窗口 · Top {{ item.top_n }} · 门槛 ≥{{ item.min_stars }}★ ·
                                        {{ item.cutoff_date?.slice(0,10) }} ～ {{ item.data_latest_date?.slice(0,10) }} ·
                                        收录 {{ item.total_repos }} 个仓库
                                    </div>
                                </div>
                                <div class="d-flex gap-2">
                                    <button class="app-btn primary" @click="loadSlot(item)"><i class="bi bi-eye"></i> 查看此快照</button>
                                    <a :href="item.markdown" target="_blank" class="app-btn"><i class="bi bi-markdown"></i> MD 报告</a>
                                    <a :href="item.json" target="_blank" class="app-btn"><i class="bi bi-braces"></i> JSON</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 视图 2: 语言生态趋势表 -->
                <div v-else-if="activeTab === 'lang'">
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <h3 class="fs-5 fw-bold m-0 d-flex align-items-center gap-2">
                            <i class="bi bi-pie-chart-fill text-success"></i> 主流语言增长格局
                            <span class="badge-pill brand">{{ langRows.length }} 种语言</span>
                        </h3>
                    </div>

                    <div class="app-table-wrapper">
                        <table class="app-table">
                            <thead>
                                <tr>
                                    <th style="width: 3.5rem">#</th>
                                    <th>编程语言</th>
                                    <th class="text-right">收录仓库数</th>
                                    <th class="text-right d-none d-md-table-cell">Star 资产总量</th>
                                    <th class="text-right">Star 周期增量</th>
                                    <th class="text-right d-none d-md-table-cell">Fork 增量</th>
                                    <th class="text-right d-none d-lg-table-cell">日均新增/库</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="(r, i) in langRows" :key="r.language">
                                    <td>
                                        <span class="rank-badge" :class="'rank-' + (i + 1)">{{ i + 1 }}</span>
                                    </td>
                                    <td>
                                        <div class="d-flex align-items-center gap-2">
                                            <span :style="{ color: langColor(r.language), fontSize: '1.2rem' }">●</span>
                                            <strong class="fs-6">{{ r.language }}</strong>
                                        </div>
                                    </td>
                                    <td class="text-right fw-semibold">{{ r.repo_count }}</td>
                                    <td class="text-right d-none d-md-table-cell text-muted">{{ (r.total_stars || 0).toLocaleString() }}</td>
                                    <td class="text-right">
                                        <span class="fw-bold" :class="r.star_diff > 0 ? 'text-success' : (r.star_diff < 0 ? 'text-danger' : 'text-muted')">
                                            {{ r.star_diff >= 0 ? '+' : '' }}{{ (r.star_diff || 0).toLocaleString() }} ★
                                        </span>
                                    </td>
                                    <td class="text-right d-none d-md-table-cell text-info fw-semibold">
                                        +{{ (r.fork_diff || 0).toLocaleString() }} 🍴
                                    </td>
                                    <td class="text-right d-none d-lg-table-cell text-success">
                                        +{{ r.avg_daily_star }} ★/天
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 视图 3: 通用项目排行榜 -->
                <template v-else>
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <h3 class="fs-5 fw-bold m-0 d-flex align-items-center gap-2">
                            <span>{{ currentTabMeta?.icon }}</span> {{ currentTabMeta?.label }} 排行榜
                            <span class="badge-pill brand">{{ currentRows.length }} 个项目</span>
                        </h3>
                    </div>

                    <div v-if="currentRows.length === 0" class="app-empty-box">
                        <i class="bi bi-inbox"></i>
                        <div>该分类下暂无符合门槛的仓库数据</div>
                    </div>

                    <div v-else class="app-table-wrapper">
                        <table class="app-table">
                            <thead>
                                <tr>
                                    <th style="width: 3.5rem">#</th>
                                    <th>仓库与核心定位</th>
                                    <th class="d-none d-md-table-cell">语言</th>
                                    <th class="text-right" v-if="activeTab === 'heat'">综合热度</th>
                                    <th class="text-right">当前 ★</th>
                                    <th class="text-right" v-if="activeTab !== 'total'">Star 增量</th>
                                    <th class="text-right d-none d-md-table-cell" v-if="activeTab !== 'total'">增长率</th>
                                    <th class="text-right d-none d-md-table-cell" v-if="activeTab === 'fork'">Fork 增量</th>
                                    <th class="text-right d-none d-lg-table-cell" v-if="activeTab === 'daily'">日均新增</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="(r, i) in currentRows" :key="r.id || r.full_name">
                                    <td>
                                        <span class="rank-badge" :class="'rank-' + (i + 1)">{{ i + 1 }}</span>
                                    </td>
                                    <td>
                                        <div class="d-flex align-items-center gap-2 flex-wrap mb-1">
                                            <a :href="r.html_url" target="_blank" class="fw-bold text-decoration-none" style="color: var(--text-primary); font-size: 0.95rem;">
                                                {{ r.full_name }}
                                            </a>
                                            <a :href="'history.html?repo=' + encodeURIComponent(r.full_name)" class="badge-pill brand text-decoration-none" title="查看此项目的演进走势与历史快照">
                                                <i class="bi bi-graph-up"></i> 走势
                                            </a>
                                        </div>
                                        <div class="text-muted small text-truncate" style="max-width: 480px;" :title="r.description">
                                            {{ r.description || '暂无描述' }}
                                        </div>
                                    </td>
                                    <td class="d-none d-md-table-cell">
                                        <span class="badge-pill">
                                            <span :style="{ color: langColor(r.language) }">●</span> {{ r.language || 'Other' }}
                                        </span>
                                    </td>
                                    <td class="text-right fw-bold text-warning" v-if="activeTab === 'heat'">
                                        <div class="d-inline-flex align-items-center gap-2">
                                            <div style="width: 48px; height: 6px; background: var(--bg-surface-mute); border-radius: 3px; overflow: hidden;" class="d-none d-sm-block">
                                                <div :style="{ width: r.heat_score + '%', height: '100%', background: 'linear-gradient(90deg, #f59e0b, #ef4444)' }"></div>
                                            </div>
                                            <span>{{ r.heat_score }}</span>
                                        </div>
                                    </td>
                                    <td class="text-right fw-bold">{{ (r.current_stars || 0).toLocaleString() }}</td>
                                    <td class="text-right" v-if="activeTab !== 'total'">
                                        <span class="fw-bold" :class="r.star_diff > 0 ? 'text-success' : (r.star_diff < 0 ? 'text-danger' : 'text-muted')">
                                            {{ r.star_diff >= 0 ? '+' : '' }}{{ (r.star_diff || 0).toLocaleString() }}
                                        </span>
                                    </td>
                                    <td class="text-right d-none d-md-table-cell" v-if="activeTab !== 'total'">
                                        <span class="fw-bold" :class="r.star_growth_rate > 0 ? 'text-success' : (r.star_growth_rate < 0 ? 'text-danger' : 'text-muted')">
                                            {{ r.star_growth_rate >= 0 ? '+' : '' }}{{ r.star_growth_rate }}%
                                        </span>
                                    </td>
                                    <td class="text-right d-none d-md-table-cell text-info fw-semibold" v-if="activeTab === 'fork'">
                                        +{{ (r.fork_diff || 0).toLocaleString() }} 🍴
                                    </td>
                                    <td class="text-right d-none d-lg-table-cell text-success fw-semibold" v-if="activeTab === 'daily'">
                                        +{{ r.star_daily_avg }} ★/天
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </template>
            </template>
        </div>
    </main>

    <!-- 统一页脚 -->
    <footer class="app-footer">
        <div>Starred Projects · 自动化 GitHub Star 资产管理与趋势洞察系统</div>
        <div class="small text-muted mt-1">数据由 GitHub Actions 定时自动更新 · 深度集成大语言模型中文技术解析</div>
    </footer>
</div>

<script>
const { createApp, ref, computed, onMounted, watch } = Vue;

createApp({
    setup() {
        const isDark = ref(StarredCommon.getTheme() === 'dark');
        const toggleTheme = () => {
            const next = StarredCommon.toggleTheme();
            isDark.value = (next === 'dark');
        };

        const loading = ref(true);
        const error = ref('');
        const data = ref({});
        const activeTab = ref('heat');
        const historyList = ref([]);
        const historyLoading = ref(false);
        const currentSlot = ref('');

        const tabs = [
            { key: 'heat', icon: '🔥', label: '综合热度' },
            { key: 'growth', icon: '🚀', label: 'Star 增长率' },
            { key: 'star_diff', icon: '⭐', label: 'Star 净增量' },
            { key: 'fork', icon: '🍴', label: 'Fork 爆发榜' },
            { key: 'daily', icon: '📈', label: '日均新增' },
            { key: 'new', icon: '🆕', label: '新收录' },
            { key: 'total', icon: '🏆', label: 'Star 总量' },
            { key: 'decline', icon: '📉', label: '负增长' },
            { key: 'lang', icon: '🌐', label: '语言格局' },
            { key: 'history', icon: '🕐', label: '快照历史' },
        ];

        const currentTabMeta = computed(() => tabs.find(t => t.key === activeTab.value));
        const rankings = computed(() => data.value.rankings || {});
        const topHeatRepo = computed(() => (rankings.value.heat_score_top || [])[0]);
        const topStarDiffRepo = computed(() => (rankings.value.star_diff_top || [])[0]);
        const topGrowthRepo = computed(() => (rankings.value.star_growth_rate_top || []).filter(r => r.star_diff > 0)[0]);
        const topLang = computed(() => (data.value.language_trends || [])[0]);
        const langRows = computed(() => data.value.language_trends || []);

        const currentRows = computed(() => {
            const m = {
                heat: rankings.value.heat_score_top || [],
                new: rankings.value.new_repos_top || [],
                growth: (rankings.value.star_growth_rate_top || []).filter(r => r.star_diff > 0),
                star_diff: (rankings.value.star_diff_top || []).filter(r => r.star_diff > 0),
                fork: (rankings.value.fork_diff_top || []).filter(r => r.fork_diff > 0),
                daily: (rankings.value.star_daily_avg_top || []).filter(r => r.star_daily_avg > 0),
                total: rankings.value.star_total_top || [],
                decline: (rankings.value.star_growth_rate_bottom || []).filter(r => r.star_diff < 0),
            };
            return m[activeTab.value] || [];
        });

        function langColor(lang) {
            return StarredCommon.getLanguageColor(lang);
        }

        async function loadData(url = 'data/trend.json') {
            loading.value = true;
            error.value = '';
            try {
                let r = await fetch(url + '?_t=' + Date.now());
                if (!r.ok && url === 'data/trend.json') {
                    r = await fetch('trend.json?_t=' + Date.now());
                }
                if (!r.ok) throw new Error('HTTP ' + r.status);
                data.value = await r.json();
                if (data.value.status !== 'success') throw new Error(data.value.message || '数据格式错误');
            } catch (e) {
                error.value = '加载失败：' + e.message;
            }
            loading.value = false;
        }

        async function loadHistory() {
            historyLoading.value = true;
            try {
                let r = await fetch('data/trend_history/index.json?_t=' + Date.now());
                if (!r.ok) {
                    r = await fetch('trend_history/index.json?_t=' + Date.now());
                }
                if (r.ok) historyList.value = await r.json();
            } catch {}
            historyLoading.value = false;
        }

        async function loadSlot(item) {
            currentSlot.value = item.slot;
            activeTab.value = 'heat';
            loading.value = true;
            error.value = '';
            try {
                let url = item.json;
                let r = await fetch(url + '?_t=' + Date.now());
                if (!r.ok && !url.startsWith('data/')) {
                    r = await fetch('data/' + url + '?_t=' + Date.now());
                }
                if (!r.ok) throw new Error('HTTP ' + r.status);
                data.value = await r.json();
            } catch (e) {
                error.value = '加载快照失败：' + e.message;
            }
            loading.value = false;
        }

        async function reloadLatest() {
            currentSlot.value = '';
            await loadData();
        }

        watch(activeTab, v => {
            if (v === 'history' && historyList.value.length === 0) {
                loadHistory();
            }
        });

        onMounted(() => {
            loadData();
            loadHistory();
            window.addEventListener('starred-theme-changed', (e) => {
                isDark.value = (e.detail.theme === 'dark');
            });
        });

        return {
            isDark,
            toggleTheme,
            loading,
            error,
            data,
            activeTab,
            tabs,
            currentTabMeta,
            topHeatRepo,
            topStarDiffRepo,
            topGrowthRepo,
            topLang,
            currentRows,
            langRows,
            historyList,
            historyLoading,
            currentSlot,
            loadSlot,
            reloadLatest,
            langColor,
        };
    }
}).mount('#app');
</script>
</body>
</html>
